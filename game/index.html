let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.04,(now-last)/1000);last=now;let actor=active||player,f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y,s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;const inputLen=Math.hypot(f,s);if(inputLen>1){f/=inputLen;s/=inputLen}if(active){active.rotation.y+=s*dt*1.7;active.position.x+=Math.sin(active.rotation.y)*f*dt*(keys.shift?22:12);active.position.z+=Math.cos(active.rotation.y)*f*dt*(keys.shift?22:12)}else if(inputLen>.05){const speed=(keys.shift?12:6.5)*dt;const forward=new THREE.Vector3(-Math.sin(camera.rotation.y),0,-Math.cos(camera.rotation.y));forward.y=0;forward.normalize();const right=new THREE.Vector3(forward.z,0,-forward.x);player.position.addScaledVector(forward,f*speed);player.position.addScaledVector(right,s*speed);player.rotation.y=Math.atan2(s,f)+camera.rotation.y}actor.position.x=THREE.MathUtils.clamp(actor.position.x,-145,145);actor.position.z=THREE.MathUtils.clamp(actor.position.z,-120,120);let offset=new THREE.Vector3(0,camMode?5:7,camMode?-9:-13).applyAxisAngle(new THREE.Vector3(0,1,0),actor.rotation.y);camera.position.lerp(actor.position.clone().add(offset),1-Math.exp(-4*dt));camera.lookAt(actor.position.x,actor.position.y+1.2,actor.position.z);marker.position.y=.25+Math.sin(now*.002)*.18;marker.rotation.z=now*.0005;map();document.querySelector('#clock').textContent='19:'+String(42+Math.floor(now/60000)%18).padStart(2,'0');renderer.render(scene,camera)}requestAnimationFrame(frame);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))};toast('Добро пожаловать в Vice City');
